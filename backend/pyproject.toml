[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotd"
version = "0.1.0"
description = "ROS-free reBotArm hardware control daemon"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
rebotd = "rebotd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebotd"
version = "0.1.0"
description = "ROS-free reBotArm hardware control daemon"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "websockets>=15,<18",
    "motorbridge==0.5.1",
    "pin==4.1.0",
]

[project.scripts]
rebotd = "rebotd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
